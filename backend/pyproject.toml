[project]
name = "online-exam-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.16.5",
  "argon2-cffi==25.1.0",
  "asyncpg==0.30.0",
  "fastapi==0.117.1",
  "email-validator==2.3.0",
  "pydantic-settings==2.11.0",
  "pyjwt==2.10.1",
  "redis==6.4.0",
  "sqlmodel==0.0.25",
  "uvicorn[standard]==0.36.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "ruff==0.13.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
