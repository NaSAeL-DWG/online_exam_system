<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>知衡 · 配色 UI 评审</title>
    <style>
      /* 已通过的灰度结构作为基线；本文件末尾的色彩变量与语义样式负责配色。 */
      :root {
        --ink: #202020;
        --muted: #626262;
        --line: #d8d8d8;
        --soft: #f4f4f4;
        --paper: #fff;
        --review-h: 64px;
        font-family:
          Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--ink);
        background: var(--soft);
        font-synthesis: none;
        color-scheme: light;
        accent-color: #242424;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-size: 14px;
        line-height: 1.6;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button,
      a,
      input,
      select,
      textarea {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      summary:focus-visible {
        outline: 2px solid #202020;
        outline-offset: 3px;
      }
      ::selection {
        background: #d6d6d6;
        color: #111;
      }
      button:disabled {
        color: #777;
        background: #ececec;
        border-color: #ddd;
        cursor: not-allowed;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 30px;
        font-weight: 650;
        line-height: 1.35;
        letter-spacing: -1px;
      }
      h2 {
        font-size: 18px;
        font-weight: 650;
        line-height: 1.5;
      }
      h3 {
        font-size: 15px;
        font-weight: 650;
      }
      small,
      .small {
        font-size: 12px;
      }
      .muted {
        color: var(--muted);
      }
      .mono {
        font-family: Consolas, "SFMono-Regular", monospace;
        font-variant-numeric: tabular-nums;
      }
      .eyebrow {
        font-size: 10px;
        font-weight: 650;
        letter-spacing: 2px;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .icon {
        width: 19px;
        height: 19px;
        display: inline-block;
        flex: none;
        vertical-align: middle;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: square;
        stroke-linejoin: miter;
      }
      .stack {
        display: grid;
        gap: 24px;
      }
      .stack > * {
        min-width: 0;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .wrap {
        flex-wrap: wrap;
      }
      .between {
        justify-content: space-between;
      }
      .end {
        justify-content: flex-end;
      }
      .mt {
        margin-top: 24px;
      }
      .mb {
        margin-bottom: 20px;
      }
      .full {
        width: 100%;
      }
      .link {
        background: none;
        border: 0;
        padding: 2px 0;
        font-weight: 600;
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .rule {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 24px 0;
      }
      .hidden,
      [hidden] {
        display: none !important;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .review-bar {
        position: sticky;
        top: 0;
        z-index: 50;
        display: flex;
        gap: 18px;
        align-items: center;
        min-height: 64px;
        padding: 12px 24px;
        background: #262626;
        color: #fff;
        border-bottom: 1px solid #444;
      }
      .review-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: none;
      }
      .review-number {
        border: 1px solid #777;
        padding: 3px 7px;
        font:
          13px Consolas,
          monospace;
      }
      .review-brand strong {
        font-size: 13px;
        letter-spacing: 0.5px;
      }
      .review-brand small {
        display: block;
        color: #c6c6c6;
        font-size: 10px;
        letter-spacing: 1.2px;
      }
      .review-fields {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
      }
      .review-field {
        display: flex;
        gap: 7px;
        align-items: center;
        font-size: 11px;
        color: #d0d0d0;
        min-width: 0;
      }
      .review-field select {
        border: 1px solid #666;
        background: #343434;
        color: #fff;
        border-radius: 2px;
        min-height: 32px;
        max-width: 225px;
        padding: 3px 24px 3px 8px;
        font-size: 12px;
      }
      .review-bar button {
        background: none;
        color: #fff;
        border: 1px solid #737373;
        padding: 5px 10px;
        font-size: 12px;
        white-space: nowrap;
      }
      .review-bar :focus-visible {
        outline-color: #fff;
      }
      .review-note {
        font-size: 10px;
        color: #c0c0c0;
        white-space: nowrap;
      }
      .app {
        display: grid;
        grid-template-columns: 204px minmax(0, 1fr);
        min-height: calc(100vh - var(--review-h));
      }
      .sidebar {
        position: sticky;
        top: var(--review-h);
        height: calc(100vh - var(--review-h));
        background: #fafafa;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        padding: 28px 16px 18px;
        overflow: auto;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 12px 28px;
        font-weight: 750;
        font-size: 21px;
        letter-spacing: 2px;
      }
      .brand-mark {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        background: #252525;
        color: #fff;
        font-size: 13px;
        letter-spacing: -1px;
        font-family: Consolas, monospace;
      }
      .brand small {
        font-size: 10px;
        letter-spacing: 1px;
        display: block;
        font-weight: 400;
        color: #777;
      }
      .nav-group {
        margin-bottom: 24px;
      }
      .nav-label {
        font-size: 10px;
        color: #707070;
        letter-spacing: 1.5px;
        padding: 0 12px;
        margin-bottom: 8px;
      }
      .nav-item {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 11px;
        border: 0;
        background: none;
        text-align: left;
        padding: 10px 12px;
        margin: 3px 0;
        font-size: 13px;
        border-radius: 2px;
        color: #575757;
      }
      .nav-item:hover {
        background: #eaeaea;
        color: #111;
      }
      .nav-item.active {
        background: #272727;
        color: #fff;
      }
      .nav-item .count {
        margin-left: auto;
        font:
          11px Consolas,
          monospace;
      }
      .sidebar-foot {
        margin-top: auto;
        border-top: 1px solid var(--line);
        padding: 16px 12px 0;
        color: #777;
        font-size: 11px;
      }
      .workspace {
        min-width: 0;
      }
      .topbar {
        height: 66px;
        padding: 0 36px;
        background: #fff;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .breadcrumb {
        font-size: 12px;
        display: flex;
        gap: 12px;
        align-items: center;
        color: #737373;
      }
      .breadcrumb strong {
        font-weight: 500;
        color: #333;
      }
      .user {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        white-space: nowrap;
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 29px;
        height: 29px;
        border: 1px solid #bfbfbf;
        background: #f2f2f2;
        font-size: 12px;
      }
      .user-role {
        border-left: 1px solid var(--line);
        padding-left: 10px;
        color: #666;
      }
      .mobile-menu {
        display: none;
        border: 0;
        background: none;
        padding: 4px;
      }
      .main {
        max-width: 1420px;
        margin: 0 auto;
        padding: 34px 36px 48px;
      }
      .page-heading {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 28px;
      }
      .page-heading p {
        color: var(--muted);
        font-size: 13px;
        margin-top: 10px;
      }
      .page-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .btn {
        min-height: 38px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid #bcbcbc;
        border-radius: 2px;
        padding: 8px 15px;
        background: #fff;
        font-size: 13px;
        font-weight: 550;
        line-height: 1.5;
        text-align: center;
      }
      .btn:hover:not(:disabled) {
        background: #e9e9e9;
        border-color: #777;
      }
      .btn.primary {
        background: #242424;
        border-color: #242424;
        color: #fff;
      }
      .btn.primary:hover:not(:disabled) {
        background: #454545;
      }
      .btn.small {
        min-height: 30px;
        padding: 5px 10px;
        font-size: 12px;
      }
      .btn.quiet {
        background: transparent;
        border-color: transparent;
      }
      .btn.danger {
        border-width: 2px;
        border-color: #444;
      }
      .panel {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 2px;
        min-width: 0;
      }
      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 20px 24px;
        border-bottom: 1px solid var(--line);
      }
      .panel-body {
        padding: 24px;
      }
      .section-heading {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        margin-bottom: 16px;
      }
      .section-heading .sub {
        font-size: 12px;
        color: #666;
        font-weight: 400;
        margin-left: 8px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 8px;
        border: 1px solid #bdbdbd;
        border-radius: 2px;
        font-size: 11px;
        line-height: 1.5;
        white-space: nowrap;
        background: #fff;
        font-weight: 500;
      }
      .badge.strong {
        background: #262626;
        border-color: #262626;
        color: #fff;
      }
      .badge.soft {
        background: #f0f0f0;
        border-color: #dedede;
        color: #5c5c5c;
      }
      .badge.dashed {
        border-style: dashed;
      }
      .dot {
        width: 5px;
        height: 5px;
        background: currentColor;
        display: inline-block;
      }
      .feature {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 250px;
        background: #fff;
        border: 1px solid #333;
        border-left: 4px solid #242424;
      }
      .feature-main {
        padding: 28px 28px;
      }
      .feature h2 {
        font-size: 24px;
        margin: 16px 0 12px;
        letter-spacing: -0.6px;
      }
      .feature p {
        color: #666;
        font-size: 13px;
      }
      .feature-side {
        border-left: 1px solid var(--line);
        padding: 28px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: #fafafa;
      }
      .feature-side .clock {
        font:
          36px Consolas,
          monospace;
        letter-spacing: -1px;
        margin: 4px 0 18px;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 24px;
        font-size: 12px;
        color: #666;
      }
      .meta strong {
        color: #333;
        font-weight: 500;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        border: 1px solid var(--line);
        background: #fff;
      }
      .stat {
        padding: 22px 24px;
        border-right: 1px solid var(--line);
      }
      .stat:last-child {
        border: 0;
      }
      .stat label {
        display: block;
        color: #6b6b6b;
        font-size: 12px;
      }
      .stat strong {
        display: block;
        font-size: 29px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        line-height: 1.4;
        margin-top: 8px;
      }
      .stat small {
        font-size: 11px;
        color: #777;
        margin-left: 7px;
      }
      .grid-2 {
        display: grid;
        grid-template-columns: minmax(0, 1.6fr) minmax(280px, 1fr);
        gap: 24px;
      }
      .grid-equal {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
      }
      .detail-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 24px;
      }
      .exam-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 125px 110px;
        gap: 20px;
        align-items: center;
        padding: 22px 24px;
        border-bottom: 1px solid var(--line);
      }
      .exam-row:last-child {
        border-bottom: 0;
      }
      .exam-row h3 {
        margin-bottom: 8px;
      }
      .exam-row .meta {
        font-size: 11px;
        gap: 14px;
      }
      .date-block {
        font-size: 12px;
      }
      .date-block strong {
        display: block;
        font-weight: 500;
        font-size: 13px;
      }
      .list-item {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        padding: 18px 0;
        border-bottom: 1px solid #e8e8e8;
      }
      .list-item:last-child {
        border-bottom: 0;
      }
      .list-item p {
        font-size: 12px;
        color: #777;
        margin-top: 5px;
      }
      .tabs {
        display: flex;
        gap: 26px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 22px;
        overflow: auto;
      }
      .tab {
        padding: 12px 0;
        border: 0;
        border-bottom: 2px solid transparent;
        background: none;
        color: #666;
        white-space: nowrap;
        font-size: 13px;
      }
      .tab.active {
        border-bottom-color: #222;
        color: #222;
        font-weight: 600;
      }
      .tab span {
        font:
          11px Consolas,
          monospace;
        margin-left: 6px;
        color: #777;
      }
      .filterbar {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .filterbar .search {
        min-width: 220px;
        flex: 1;
        max-width: 360px;
      }
      .input,
      select.field,
      textarea {
        border: 1px solid #bcbcbc;
        border-radius: 2px;
        background: #fff;
        padding: 10px 12px;
        min-height: 40px;
        max-width: 100%;
        width: 100%;
        font-size: 13px;
      }
      .input::placeholder,
      textarea::placeholder {
        color: #808080;
      }
      .filterbar select {
        width: 150px;
      }
      .field-label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .form-field {
        margin-bottom: 22px;
      }
      .form-field .hint {
        font-size: 11px;
        color: #707070;
        margin-top: 7px;
      }
      textarea {
        resize: vertical;
        min-height: 130px;
        line-height: 1.8;
      }
      .table-wrap {
        overflow-x: auto;
        max-width: 100%;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
        white-space: nowrap;
        font-size: 12px;
      }
      th {
        font-weight: 500;
        color: #666;
        font-size: 11px;
        background: #f7f7f7;
        padding: 13px 20px;
        border-bottom: 1px solid var(--line);
      }
      td {
        padding: 18px 20px;
        border-bottom: 1px solid #e5e5e5;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      td strong {
        font-weight: 600;
        font-size: 13px;
      }
      td .subline {
        display: block;
        color: #777;
        font-size: 11px;
        margin-top: 5px;
      }
      tbody tr:hover {
        background: #fafafa;
      }
      .table-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 20px;
        border-top: 1px solid var(--line);
        font-size: 11px;
        color: #666;
      }
      .kv {
        display: grid;
        grid-template-columns: 100px 1fr;
        gap: 14px 20px;
        font-size: 13px;
      }
      .kv dt {
        color: #666;
      }
      .kv dd {
        margin: 0;
      }
      .notice {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        border: 1px solid #c2c2c2;
        background: #f4f4f4;
        padding: 16px 18px;
        font-size: 12px;
        line-height: 1.8;
      }
      .notice.urgent {
        border: 2px solid #333;
        background: #ededed;
      }
      .notice strong {
        display: block;
        font-size: 13px;
        margin-bottom: 3px;
      }
      .notice .icon {
        margin-top: 3px;
      }
      .steps {
        counter-reset: steps;
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .steps li {
        counter-increment: steps;
        display: flex;
        gap: 16px;
        margin-bottom: 23px;
        font-size: 13px;
        color: #555;
      }
      .steps li:last-child {
        margin-bottom: 0;
      }
      .steps li:before {
        content: counter(steps, decimal-leading-zero);
        font:
          12px Consolas,
          monospace;
        padding-top: 3px;
        color: #777;
      }
      .steps strong {
        display: block;
        color: #222;
        margin-bottom: 5px;
        font-weight: 600;
      }
      .footer-note {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 32px;
        color: #777;
        font-size: 10px;
        letter-spacing: 0.5px;
      }
      /* 作答与阅卷收敛全局导航，独立控制区持续显示时间与保存状态。 */
      .focus-mode {
        grid-template-columns: 1fr;
      }
      .focus-mode .sidebar {
        display: none;
      }
      .focus-mode .main {
        max-width: 1320px;
      }
      .exam-strip {
        position: sticky;
        top: var(--review-h);
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        background: #fff;
        border-bottom: 1px solid #a8a8a8;
        padding: 14px max(28px, calc((100vw - 1248px) / 2));
      }
      .exam-strip h2 {
        font-size: 16px;
      }
      .exam-strip .timer {
        font:
          27px Consolas,
          monospace;
        line-height: 1.1;
      }
      .exam-strip .timer-label {
        font-size: 10px;
        color: #666;
      }
      .exam-strip .timer-block {
        border-left: 1px solid var(--line);
        padding-left: 24px;
      }
      .exam-strip .warning-time {
        border: 2px solid #222;
        padding: 6px 14px;
        background: #eee;
      }
      .attempt-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 268px;
        gap: 24px;
        align-items: start;
      }
      .question-panel {
        padding: 32px;
      }
      .question-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 12px;
        color: #666;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 26px;
      }
      .question-number {
        font:
          24px Consolas,
          monospace;
        color: #222;
        margin-right: 10px;
      }
      .question-copy {
        font-size: 17px;
        line-height: 1.95;
        max-width: 800px;
        margin-bottom: 26px;
      }
      .question-copy .formula {
        display: block;
        font-family: Georgia, serif;
        text-align: center;
        font-size: 24px;
        padding: 22px;
        background: #f8f8f8;
        border: 1px solid #e2e2e2;
        margin-top: 20px;
      }
      .choices {
        display: grid;
        gap: 12px;
      }
      .choice {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        padding: 16px 18px;
        border: 1px solid #ccc;
        border-radius: 2px;
        cursor: pointer;
        font-size: 14px;
        line-height: 1.7;
      }
      .choice:hover {
        border-color: #666;
        background: #fafafa;
      }
      .choice.selected {
        border: 2px solid #262626;
        padding: 15px 17px;
        background: #f1f1f1;
      }
      .choice input {
        margin-top: 6px;
        flex: none;
      }
      .choice-letter {

      /* 第一轮审核：焦点强调控件自身边界，下拉选项采用统一的浮层。 */
      .input:focus,

        const ramps = families

            ([key, name, description]) =>
              `<section class="palette-family"><h3>${name}</h3><p>${description}</p><div class="palette-ramp">${levels
                .map((level) => {
                  const color = styles
                    .getPropertyValue(`--${key}-${level}`)
                    .trim();
                  const luminance = relativeLuminance(color);
                  const text =
                    1.05 / (luminance + 0.05) >= 4.5 ? "#ffffff" : "#000000";
                  return `<div class="palette-swatch" style="background:${color};color:${text}" title="${name} ${level}：${color}"><strong>${level}</strong><span>${color.toUpperCase()}</span></div>`;

      function relativeLuminance(hex) {
        const channels = hex
          .slice(1)
          .match(/.{2}/g)
          .map((part) => parseInt(part, 16) / 255);
        const linear = channels.map((value) =>
          value <= 0.04045 ? value / 12.92 : ((value + 0.055) / 1.055) ** 2.4,
        );

          navigate("student-home");
          toast("已进入学生演示账号");
        } else if (["register-form", "password-form"].includes(form.id)) {
          const password = form.elements.namedItem("password").value,
            confirm = form.elements.namedItem("confirm").value,
            error = $(
              "#" +
                (form.id === "register-form"
                  ? "register-error"
                  : "password-error"),
            );
          if (password !== confirm) {
            error.hidden = false;
            error.textContent = "两次输入的密码不一致，请核对。";
            form.elements.namedItem("confirm").focus();
            return;
          }
          navigate(form.id === "register-form" ? "application" : "login");
          toast(
            form.id === "register-form"
              ? "注册申请已提交（当前演示）"
              : "密码已修改，请重新登录（当前演示）",
          );
        } else if (["teacher-form", "class-form"].includes(form.id)) {
          $("#dialog").close();
          toast("记录已保存（当前演示）");
        } else if (form.id === "contact-form")
          toast("联系方式已保存（当前演示）");
      });
      // URL 只记录评审页面与场景，不包含任何输入或答案。
      const initialParams = new URLSearchParams(location.search),
        initialPage = initialParams.get("page");
      if (pages.some((p) => p[0] === initialPage)) {
        state.page = initialPage;
        state.role = pages.find((p) => p[0] === initialPage)[1];
        if (initialParams.get("role") === "admin" && state.role === "staff")
          state.role = "admin";
        const scene = initialParams.get("scene");
        if (pageScenes[initialPage].includes(scene)) state.scene = scene;
      }
      new ResizeObserver(() =>
        document.documentElement.style.setProperty(
          "--review-h",
          `${$("#review-bar").offsetHeight}px`,
        ),
      ).observe($("#review-bar"));
      render();
    </script>
  </body>
</html>
